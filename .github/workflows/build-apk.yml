name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HAVE_KS=1" >> "$GITHUB_ENV"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore configured - signed release build."
          else
            echo "HAVE_KS=0" >> "$GITHUB_ENV"
            echo "No keystore secret - debug build."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          set +e
          if [ "$HAVE_KS" = "1" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          echo "Running gradle $TASK"
          gradle $TASK --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -nE "^e: |error: |Unresolved reference|cannot access|> Task .* FAILED|Caused by:|Exception:|FAILURE:|What went wrong" build.log | tail -60 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code

      - name: Locate & prepare versioned APKs
        id: apk
        run: |
          set -e
          VER="1.0.${{ github.run_number }}"
          F=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | grep -v unsigned | head -1 || true)
          [ -z "$F" ] && F=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          [ -z "$F" ] && F=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1 || true)
          echo "Found APK: $F"
          cp "$F" "Location-Changer-Master-Sahib.apk"
          cp "$F" "Location-Changer-Master-Sahib-v${VER}.apk"
          ls -lh Location-Changer-Master-Sahib*.apk

      - name: Write version manifest
        run: |
          cat > latest-version.json <<EOF
          {"versionCode": ${{ github.run_number }}, "versionName": "1.0.${{ github.run_number }}", "url": "https://github.com/mohammadfaisalpirzada/location-changer-master/releases/download/latest/Location-Changer-Master-Sahib.apk"}
          EOF
          cat latest-version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: location-changer-master-sahib
          path: Location-Changer-Master-Sahib.apk

      - name: Publish to Latest Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Location Changer - Master Sahib v1.0.${{ github.run_number }}"
          body: "Virtual GPS location spoofer for Android devices."
          files: |
            Location-Changer-Master-Sahib.apk
            Location-Changer-Master-Sahib-v1.0.${{ github.run_number }}.apk
            latest-version.json
